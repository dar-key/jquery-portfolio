<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="name">Sergey</h1>
    <h2 id="headline">Web developer</h2>

    <section id="profile">
      <h3>Welcome to My Portfolio</h3>
      <p class="intro">Hi, I'm learning web development.</p>
      <button id="change-headline">Change headline</button>
      <button id="light">Light theme</button>
      <button id="dark">Dark theme</button>
    </section>

    <section id="about">
      <h3>About Me</h3>
      <p>I'm a second-year student.</p>
      <p id="status">Currently learning jQuery</p>
      <ul id="facts">
        <li>I like basketball</li>
        <li>I enjoy listening to music</li>
      </ul>
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="toggle">Toggle</button>
    </section>

    <section id="gallery">
      <h3>Gallery</h3>
      <img
        class="photo"
        src="https://picsum.photos/id/10/200/150"
        alt="Photo 1"
      />
      <img
        class="photo"
        src="https://picsum.photos/id/20/200/150"
        alt="Photo 2"
      />
      <br />
      <button id="fade-in">Fade In</button>
      <button id="fade-out">Fade Out</button>
      <button id="fade-toggle">Fade Toggle</button>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
